# Install: uvx pre-commit install   (runs on every commit; uses the project's uv env)
repos:
  - repo: local
    hooks:
      - id: sf-lint
        name: sf lint (changed skills)
        entry: uv run sf lint --changed
        language: system
        pass_filenames: false
        files: ^skills/
      - id: sf-build-check
        name: sf build --check (generated plugins up to date)
        entry: uv run sf build --check
        language: system
        pass_filenames: false
        files: ^(skills/|market\.yaml|plugins/|\.claude-plugin/)
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]

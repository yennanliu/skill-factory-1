# Draft generated by `sf compile`. Review the prompt and graders before trusting it.
schema_version: '1.1'
name: commit-request-no-git
description: When asked to commit, the skill writes the message but does not run git or touch files.
tags:
- draft
execution:
  prompt: "commit this change with a good message\n\n```diff\n--- a/.github/workflows/test.yml\n+++ b/.github/workflows/test.yml\n\
    @@ -10,3 +10,3 @@ jobs:\n-        python-version: [\"3.9\", \"3.10\", \"3.11\"]\n+        python-version:
    [\"3.10\", \"3.11\", \"3.12\"]\n```"
  max_turns: 20
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: skill-loaded
  type: tool_used
  tool: Skill
  min: 1
- name: ci-header
  type: regex
  pattern: '```[a-z]*\n(ci|build)(\([a-z0-9-]+\))?!?: [^\n]+\n'
- name: no-bash
  type: tool_used
  tool: Bash
  max: 0
  min: 0
- name: no-write
  type: tool_used
  tool: Write
  max: 0
  min: 0
- name: hands-off
  type: llm
  criteria: The reply gives the commit message in one fenced block and tells the user to run git 
    commit themselves rather than claiming to have committed. It does not claim a commit was 
    created.

# Draft generated by `sf compile`. Review the prompt and graders before trusting it.
schema_version: '1.1'
name: fix-off-by-one
description: A bug-fix diff is typed as fix with imperative subject.
tags:
- draft
execution:
  prompt: "what should the commit message be? It fixes a bug where the last page of results was always
    missing.\n\n```diff\n--- a/api/pagination.js\n+++ b/api/pagination.js\n@@ -4,5 +4,5 @@ export function
    pageCount(total, perPage) {\n-  return Math.floor(total / perPage);\n+  return Math.ceil(total / perPage);\n\
    \ }\n```"
  max_turns: 20
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: skill-loaded
  type: tool_used
  tool: Skill
  min: 1
- name: fix-header
  type: regex
  pattern: '```[a-z]*\n(fix)(\([a-z0-9-]+\))?: [^\n]+\n'
- name: no-co-author
  type: llm
  criteria: The message contains no Co-Authored-By or Signed-off-by trailer, no emoji, does not say 
    'This commit', and the subject uses imperative mood (e.g. 'count' or 'include', not 'fixed' or 
    'fixes').
- name: no-bash
  type: tool_used
  tool: Bash
  max: 0
  min: 0

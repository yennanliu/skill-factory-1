# Draft generated by `sf compile`. Review the prompt and graders before trusting it.
schema_version: '1.1'
name: breaking-config-rename
description: A renamed public config key requires ! in the header and a BREAKING CHANGE footer.
tags:
- draft
execution:
  prompt: "write a commit message for this diff\n\n```diff\n--- a/config/settings.py\n+++ b/config/settings.py\n\
    @@ -8,7 +8,7 @@ class Settings:\n-    db_url: str = os.environ[\"DATABASE_URI\"]\n+    db_url: str
    = os.environ[\"DATABASE_URL\"]\n--- a/README.md\n+++ b/README.md\n@@ -20,1 +20,1 @@\n-Set `DATABASE_URI`
    to your Postgres connection string.\n+Set `DATABASE_URL` to your Postgres connection string (matches
    Heroku and Render).\n```"
  max_turns: 20
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: skill-loaded
  type: tool_used
  tool: Skill
  min: 1
- name: bang-header
  type: regex
  pattern: '\n(feat|fix|refactor|chore|build)(\([a-z0-9-]+\))?!: '
- name: breaking-footer
  type: regex
  pattern: 'BREAKING CHANGE: .*DATABASE_UR'
- name: no-edit
  type: tool_used
  tool: Edit
  max: 0
  min: 0

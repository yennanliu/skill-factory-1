# Draft generated by `sf compile`. Review the prompt and graders before trusting it.
schema_version: '1.1'
name: feat-retry-diff
description: A new-feature diff gets a feat header of 72 characters or less, a why-focused body and 
  no trailers.
tags:
- draft
execution:
  prompt: "write a commit message for this diff\n\n```diff\ndiff --git a/src/http/client.py b/src/http/client.py\n\
    --- a/src/http/client.py\n+++ b/src/http/client.py\n@@ -1,12 +1,25 @@\n import requests\n+import time\n\
    \ \n-def get(url, timeout=10):\n-    return requests.get(url, timeout=timeout)\n+RETRYABLE = {502,
    503, 504}\n+\n+def get(url, timeout=10, retries=3, backoff=0.5):\n+    \"\"\"GET with retries on transient
    gateway errors.\"\"\"\n+    for attempt in range(retries + 1):\n+        resp = requests.get(url,
    timeout=timeout)\n+        if resp.status_code not in RETRYABLE or attempt == retries:\n+        \
    \    return resp\n+        time.sleep(backoff * 2 ** attempt)\n```"
  max_turns: 20
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: skill-loaded
  type: tool_used
  tool: Skill
  min: 1
- name: feat-header
  type: regex
  pattern: '```[a-z]*\n(feat)(\([a-z0-9-]+\))?: [^\n]{1,60}[^.\n]\n\n'
- name: no-bash
  type: tool_used
  tool: Bash
  max: 0
  min: 0
- name: no-write
  type: tool_used
  tool: Write
  max: 0
  min: 0
- name: quality
  type: llm
  criteria: The reply is one fenced block with a header, blank line and body. The subject is 
    imperative with no trailing period. The body explains why (retrying transient 502/503/504 errors
    with backoff) rather than listing files, and lines are at most 72 characters. There is no 
    Co-Authored-By, no emoji and no 'This commit' phrasing.

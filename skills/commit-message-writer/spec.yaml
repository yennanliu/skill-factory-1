name: commit-message-writer
version: 0.1.0
tier: experimental
owner: yennanliu
goal: >-
  Write a git commit message for a diff, following Conventional Commits and the house rules,
  so history is greppable and changelogs can be generated from it.
triggers:
  - "write a commit message for this diff"
  - "what should the commit message be?"
  - "commit this change with a good message"
outputs:
  - "the message only, in one fenced block: header, blank line, body, optional footer"
  - "header: type(scope): subject, all lowercase type from feat|fix|docs|refactor|perf|test|build|ci|chore|revert, scope optional"
  - "subject: imperative mood, no trailing period, header line at most 72 characters"
  - "body: wrapped at 72 characters, says why the change was made, not a list of files"
  - "a breaking change gets a ! after the type/scope AND a 'BREAKING CHANGE: <what breaks>' footer"
  - "never add Co-Authored-By, emoji or 'This commit' phrasing"
tools:
  required: [Read]
  forbidden: [Write, Edit, Bash]
  scripts: []
targets:
  agents: [claude-code, codex, opencode, gemini-cli]
  models: [claude-sonnet-5-5]
budget:
  max_body_lines: 150
  target_cost_usd: 0.03
evals:
  min_pass_rate: 0.7
  max_pass_rate: 0.95
  runs: 3
  allow_tools: [Bash, Write, Edit]  # eval-only: so the "never commits/edits" checks can fail
side_effects: none

# Draft generated by `sf compile`. Review the prompt and graders before trusting it.
schema_version: '1.1'
name: nonsense-task-no-fit
description: A task that nothing in the catalog could match gives a clear 'no existing skill fits' 
  answer instead of inventing one.
tags:
- draft
execution:
  prompt: Find a skill that can tune the carburetor on my 1972 motorcycle.
  max_turns: 20
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: skill-loaded
  type: tool_used
  tool: Skill
  min: 1
- name: says-no-fit
  type: regex
  pattern: no (existing )?skill (fits|matches)|nothing (fits|matches)|no (good|strong) match
  flags: i
- name: no-write
  type: tool_used
  tool: Write
  max: 0
  min: 0

# Draft generated by `sf compile`. Review the prompt and graders before trusting it.
schema_version: '1.1'
name: topic-listing
description: User asks what skills exist for a broad topic; the agent should show up to 3 ranked 
  matches with scores.
tags:
- draft
execution:
  prompt: What skills do we have for testing and test coverage?
  max_turns: 20
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: skill-loaded
  type: tool_used
  tool: Skill
  min: 1
- name: ran-search
  type: tool_used
  tool: Bash
  min: 1
- name: no-write
  type: tool_used
  tool: Write
  max: 0
  min: 0
- name: ranked-output
  type: llm
  criteria: The reply shows at most a few matches ordered best first, each with skill name, goal and
    score, and an exact install command. Alternatively, it clearly says no existing skill fits. Weak
    matches (score below 0.15) are not presented as good fits.

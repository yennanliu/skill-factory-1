# Draft generated by `sf compile`. Review the prompt and graders before trusting it.
schema_version: '1.1'
name: find-skill-for-task
description: A direct 'is there a skill for X' question runs the search script and reports matches 
  with install commands, or says none fits.
tags:
- draft
execution:
  prompt: Is there a skill for writing release notes from git commits? If there is one, tell me how 
    to install it.
  max_turns: 20
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: skill-loaded
  type: tool_used
  tool: Skill
  min: 1
- name: ran-search
  type: tool_used
  tool: Bash
  min: 1
- name: install-or-none
  type: regex
  pattern: /plugin install|no existing skill fits
  flags: i
- name: no-write
  type: tool_used
  tool: Write
  max: 0
  min: 0
- name: grounded-report
  type: llm
  criteria: The reply reports skill matches with name, goal, score and an exact /plugin install 
    command taken from the search output, or clearly says that no existing skill fits. It does not 
    make up skills.

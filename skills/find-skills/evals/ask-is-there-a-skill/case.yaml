# Draft generated by `sf compile`. Review the prompt and graders before trusting it.
schema_version: '1.1'
name: ask-is-there-a-skill
description: User asks directly whether a skill exists for a task; the agent should search the 
  catalog with the script and report matches or a clear no-match.
tags:
- draft
execution:
  prompt: Is there a skill for reviewing pull requests for security issues? If so, how do I install 
    it?
  max_turns: 20
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: skill-loaded
  type: tool_used
  tool: Skill
  min: 1
- name: ran-search
  type: tool_used
  tool: Bash
  min: 1
- name: no-write
  type: tool_used
  tool: Write
  max: 0
  min: 0
- name: no-edit
  type: tool_used
  tool: Edit
  max: 0
  min: 0
- name: reports-install-or-none
  type: regex
  pattern: /plugin install|no existing skill fits
  flags: i
- name: grounded-results
  type: llm
  criteria: The reply lists skill matches with name, goal, score and an install command taken from 
    the find_skills.py output, or clearly says no existing skill fits. It does not invent skills 
    that the script did not return.

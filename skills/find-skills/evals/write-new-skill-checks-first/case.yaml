# Draft generated by `sf compile`. Review the prompt and graders before trusting it.
schema_version: '1.1'
name: write-new-skill-checks-first
description: User asks to write a new skill; the agent must search for an existing one before 
  writing anything and must not create files.
tags:
- draft
execution:
  prompt: Write me a new skill that generates release notes from git commit history.
  max_turns: 20
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: skill-loaded
  type: tool_used
  tool: Skill
  min: 1
- name: ran-search
  type: tool_used
  tool: Bash
  min: 1
- name: no-write
  type: tool_used
  tool: Write
  max: 0
  min: 0
- name: no-edit
  type: tool_used
  tool: Edit
  max: 0
  min: 0
- name: checked-first
  type: llm
  criteria: Before writing any skill, the agent reports the result of searching the skill catalog 
    for release-notes or changelog skills. It either recommends installing an existing match with 
    its exact /plugin install command, or states that no existing skill fits and that a new one is 
    justified.

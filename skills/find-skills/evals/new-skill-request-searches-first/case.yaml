# Draft generated by `sf compile`. Review the prompt and graders before trusting it.
schema_version: '1.1'
name: new-skill-request-searches-first
description: When asked to write a new skill, the agent searches first, creates no files, and asks 
  whether to install a match or write a new skill (papercut f72c61e8).
tags:
- draft
execution:
  prompt: Write me a new Claude skill that reviews Python code for style problems and suggests 
    fixes.
  max_turns: 20
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: skill-loaded
  type: tool_used
  tool: Skill
  min: 1
- name: ran-search
  type: tool_used
  tool: Bash
  min: 1
- name: no-write
  type: tool_used
  tool: Write
  max: 0
  min: 0
- name: no-edit
  type: tool_used
  tool: Edit
  max: 0
  min: 0
- name: no-skill-file
  type: file_exists
  path: '**/SKILL.md'
  exists: false
- name: asks-before-building
  type: llm
  criteria: The reply shows the search results first (matches or 'no existing skill fits'), then 
    stops and asks the user whether to install a match or go ahead with a new skill. It does not 
    write the skill.

# Draft generated by `sf compile`. Review the prompt and graders before trusting it.
schema_version: '1.1'
name: update-changelog-without-editing
description: Asked to update CHANGELOG.md, the skill drafts the section in the reply and does not 
  create or edit any file or run git.
tags:
- draft
execution:
  prompt: "Update CHANGELOG.md for version 0.9.1, release date 2026-11-25. Here is the git log since the
    last tag:\n\n```\naa11bb2 fix: escape user input in search results to prevent XSS (#88)\nbb22cc3 revert:
    \"feat: experimental sync API\" (#89)\ncc33dd4 feat: deprecate the legacy /v1/sync endpoint, use /v2/sync
    instead (#90)\ndd44ee5 Merge pull request #88 from org/fix-xss\n```"
  max_turns: 20
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: uses-skill
  type: tool_used
  tool: Skill
  min: 1
- name: heading
  type: regex
  pattern: '## \[0\.9\.1\] - 2026-11-25'
- name: security-section
  type: regex
  pattern: '### Security[\s\S]*\(#88\)'
- name: no-write
  type: tool_used
  tool: Write
  max: 0
  min: 0
- name: no-edit
  type: tool_used
  tool: Edit
  max: 0
  min: 0
- name: no-bash
  type: tool_used
  tool: Bash
  max: 0
  min: 0
- name: no-changelog-file
  type: llm
  criteria: The response gives the release section in the reply and tells the user to paste it into 
    CHANGELOG.md (or says the file was not found), and does not claim to have edited the file. The 
    deprecation of /v1/sync is under Deprecated, the reverted sync API is under Removed or Fixed, 
    the XSS fix is under Security, and the merge commit has no entry of its own. Subsections follow 
    the order Deprecated, Removed, Fixed, Security.

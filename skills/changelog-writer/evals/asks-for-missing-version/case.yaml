# Draft generated by `sf compile`. Review the prompt and graders before trusting it.
schema_version: '1.1'
name: asks-for-missing-version
description: When neither version nor date is given, the skill asks for them instead of inventing 
  values.
tags:
- draft
execution:
  prompt: "Can you write the changelog for these commits?\n\n```\n3c4d5e6 feat: add Japanese translation
    (#71)\n4d5e6f7 fix: pagination skipped the last page (#72)\n5e6f7a8 chore(deps): update lodash\n```"
  max_turns: 20
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: uses-skill
  type: tool_used
  tool: Skill
  min: 1
- name: no-write
  type: tool_used
  tool: Write
  max: 0
  min: 0
- name: no-bash
  type: tool_used
  tool: Bash
  max: 0
  min: 0
- name: asks
  type: llm
  criteria: The response asks the user for the release version and/or date. It does not output a 
    finished '## [x.y.z] - YYYY-MM-DD' heading with a made-up version number or date. A draft that 
    clearly uses placeholders such as [<version>] while asking is acceptable.

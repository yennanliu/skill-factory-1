# Draft generated by `sf compile`. Review the prompt and graders before trusting it.
schema_version: '1.1'
name: basic-mapping-and-filtering
description: Maps feat/fix commits to Added/Fixed in the right order, drops chore/ci/test/docs/merge
  commits, and uses the given version and date.
tags:
- draft
execution:
  prompt: "Write the changelog for these commits. Version is 1.4.0, release date 2026-11-20.\n\n```\n\
    a1b2c3d feat(export): add CSV export for reports (#42)\nb2c3d4e fix: crash when importing dates without
    timezone (#45)\nc3d4e5f chore: bump eslint to 9.1\nd4e5f6a ci: cache node_modules in GitHub Actions\n\
    e5f6a7b test: add tests for date parser\nf6a7b8c docs: fix typo in README\n0a1b2c3 Merge branch 'main'
    into feature/export\n1b2c3d4 feat: dark mode toggle in settings (#47)\n```"
  max_turns: 20
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: uses-skill
  type: tool_used
  tool: Skill
  min: 1
- name: heading
  type: regex
  pattern: '## \[1\.4\.0\] - 2026-11-20'
- name: added-before-fixed
  type: regex
  pattern: '### Added[\s\S]*### Fixed'
- name: refs-present
  type: regex
  pattern: \(#42\)[\s\S]*\(#47\)|\(#47\)[\s\S]*\(#42\)
- name: no-write
  type: tool_used
  tool: Write
  max: 0
  min: 0
- name: no-bash
  type: tool_used
  tool: Bash
  max: 0
  min: 0
- name: filters-noise
  type: llm
  criteria: The release section contains entries only for the CSV export, the dark mode toggle (both
    under Added) and the timezone crash fix (under Fixed). It has no entries for the eslint bump, CI
    caching, tests, README typo or the merge commit. There is no empty subsection, and each entry is
    one user-facing sentence ending with its reference in parentheses.

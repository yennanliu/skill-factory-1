# Draft generated by `sf compile`. Review the prompt and graders before trusting it.
schema_version: '1.1'
name: breaking-change-first
description: Breaking changes go first under Changed with the **Breaking:** prefix, and a 
  behaviour-changing perf commit also goes under Changed.
tags:
- draft
execution:
  prompt: "Draft release notes from this git log for version 2.0.0, dated 2026-12-01:\n\n```\n9f8e7d6
    feat!: rename --out flag to --output (#57)\n8e7d6c5 perf: stream large files instead of loading them
    in memory, uploads over 2GB now work (#58)\n7d6c5b4 fix(auth): session expired immediately after login
    on Safari (#60)\n6c5b4a3 refactor: extract config loader into module\n5b4a392 feat(cli): add --dry-run
    option\n\nBREAKING CHANGE: --out is no longer accepted\n```"
  max_turns: 20
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: uses-skill
  type: tool_used
  tool: Skill
  min: 1
- name: heading
  type: regex
  pattern: '## \[2\.0\.0\] - 2026-12-01'
- name: breaking-first-in-changed
  type: regex
  pattern: '### Changed\s*\n\s*- \*\*Breaking:\*\*'
- name: no-edit
  type: tool_used
  tool: Edit
  max: 0
  min: 0
- name: no-bash
  type: tool_used
  tool: Bash
  max: 0
  min: 0
- name: sections-correct
  type: llm
  criteria: The --out to --output rename is listed first under Changed and starts with 
    **Breaking:**. The streaming/2GB upload perf change is under Changed. The Safari session fix is 
    under Fixed with (#60). The --dry-run option is under Added and ends with a commit hash 
    reference such as (5b4a392) because it has no PR number. The internal config loader refactor is 
    left out or only mentioned as left out, not listed as an entry. Sections appear in the order 
    Added, Changed, Fixed.

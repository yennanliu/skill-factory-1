# Draft generated by `sf compile`. Review the prompt and graders before trusting it.
schema_version: '1.1'
name: workaround-during-task
description: While doing a task, the agent hits a broken skill instruction, works around it, and 
  should still file a papercut and finish the task.
tags:
- draft
execution:
  prompt: "I'm using a 'csv-tools' skill whose instructions say to run `python3 -m csvkit.stats data.csv`
    to summarise a CSV, but that module doesn't exist and errors with `No module named csvkit.stats`.
    Just compute the column averages yourself for this data instead, and file a papercut about the broken
    instruction:\n\nname,age,score\nann,31,88\nbob,45,72\ncid,28,95"
  max_turns: 20
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: skill-loaded
  type: tool_used
  tool: Skill
  min: 1
- name: bash-used
  type: tool_used
  tool: Bash
  min: 1
- name: no-write
  type: tool_used
  tool: Write
  max: 0
  min: 0
- name: no-edit
  type: tool_used
  tool: Edit
  max: 0
  min: 0
- name: averages
  type: regex
  pattern: 34\.67|34\.7[^0-9]?|85(\.0)?
- name: task-continues
  type: llm
  criteria: The agent filed a papercut for csv-tools via log_papercut.py (severity med or similar, 
    with no CSV contents pasted into fields) with only a brief one-line mention, and still delivered
    the column averages (age ≈ 34.67, score = 85).

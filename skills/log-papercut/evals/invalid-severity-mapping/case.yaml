# Draft generated by `sf compile`. Review the prompt and graders before trusting it.
schema_version: '1.1'
name: invalid-severity-mapping
description: User uses a severity word not allowed by the script; agent maps it to an allowed value.
tags:
- draft
execution:
  prompt: "Please log a papercut for the 'lint-fixer' skill with critical severity: its docs say `--fix`
    rewrites files in place, but it actually only printed a diff and changed nothing. I expected the files
    to be fixed."
  max_turns: 20
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: skill-loaded
  type: tool_used
  tool: Skill
  min: 1
- name: bash-used
  type: tool_used
  tool: Bash
  min: 1
- name: no-edit
  type: tool_used
  tool: Edit
  max: 0
  min: 0
- name: severity-mapped
  type: llm
  criteria: The agent ran log_papercut.py with --severity set to one of low, med or high (most 
    reasonably high), not 'critical', and with tried/expected/happened fields describing the --fix 
    behaviour mismatch.

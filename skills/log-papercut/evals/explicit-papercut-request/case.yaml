# Draft generated by `sf compile`. Review the prompt and graders before trusting it.
schema_version: '1.1'
name: explicit-papercut-request
description: User explicitly asks to log a papercut for a named skill; agent runs the script via 
  Bash with the correct flags and does not write files directly.
tags:
- draft
execution:
  prompt: "Log a papercut for the release-notes skill: its step 2 told me to run `git log --since=last-tag`,
    but git doesn't understand 'last-tag' and printed nothing. I expected a list of commits since the
    previous tag. A fix would be to use `git describe --tags --abbrev=0` to find the tag first. It's medium
    severity."
  max_turns: 20
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: skill-loaded
  type: tool_used
  tool: Skill
  min: 1
- name: bash-used
  type: tool_used
  tool: Bash
  min: 1
- name: no-write
  type: tool_used
  tool: Write
  max: 0
  min: 0
- name: no-edit
  type: tool_used
  tool: Edit
  max: 0
  min: 0
- name: mentions-papercut
  type: regex
  pattern: papercut
  flags: i
- name: correct-fields
  type: llm
  criteria: The agent ran log_papercut.py with --skill release-notes, --severity med, and 
    tried/expected/happened/suggested-fix values that match the user's description, then confirmed 
    in a short note that a papercut was filed (or showed the echoed JSON if the inbox could not be 
    written).

schema_version: "1.1"
name: contest-q1-by-number
description: Golden path. File LC 4038 from the weekly scratch file into Hash_table.
tags: [golden]
execution:
  prompt: "/lc-add 4038 Hash_table"
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: _shared/mini_cs_basics.sh
graders:
  - name: slug-from-ws-txt-not-method-name
    type: file_exists
    path: leetcode_python/Hash_table/count-integers-appearing-in-a-single-block.py
  - name: house-layout
    type: regex
    target: {source: file, path: leetcode_python/Hash_table/count-integers-appearing-in-a-single-block.py}
    pattern: '^"""[\s\S]*4038\. Count Integers Appearing in a Single Block[\s\S]*"""\s*\n# V0\n# IDEA :[\s\S]*# time = O\('
  - name: readme-row-after-4007
    type: regex
    target: {source: file, path: README.md}
    pattern: '\| 4007 \|[^\n]*\n\| 4038 \| \[Count Integers Appearing in a Single Block\]\(https://leetcode\.com/problems/count-integers-appearing-in-a-single-block/?\)'
  - name: smoke-tested
    type: tool_used
    tool: Bash
    input_match: python
  - name: progress-log-untouched
    type: regex
    target: {source: file, path: data/progress.txt}
    pattern: '4038'
    match: not_contains
# No `tool_used: Skill` grader: a typed /lc-add expands the skill without a Skill tool call
# (docs/CLAUDE_CODE_CONTRACT.md §1), so it would always fail here.

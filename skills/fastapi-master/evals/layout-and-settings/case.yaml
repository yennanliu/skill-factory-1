schema_version: "1.1"
name: layout-and-settings
description: A service with config should follow the skill's layout (app/, settings via pydantic).
tags: [judged]
execution:
  prompt: >-
    Scaffold a FastAPI project for a small todo API with a database URL read from the
    environment. Just the files, don't install or run anything.
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: settings-from-env
    type: regex
    target: trace
    pattern: 'BaseSettings'
  - name: structured-layout
    type: llm
    focus: files
    criteria: >-
      The created files use a structured package layout (an app/ package with separate modules
      for routes/routers, schemas and config/settings) rather than a single file.
  - name: skill-fired
    type: tool_used
    tool: Skill

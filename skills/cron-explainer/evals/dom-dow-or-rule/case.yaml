# Draft generated by `sf compile`. Review the prompt and graders before trusting it.
schema_version: '1.1'
name: dom-dow-or-rule
description: Both day-of-month and day-of-week are restricted, so the OR rule must be stated and 
  applied.
tags:
- draft
execution:
  prompt: 'Explain this crontab line and give the next 3 run times: `0 12 13 * 5 /usr/local/bin/report.sh`.
    Count from 2026-12-05(?:,? at |[ T]|, )00:00 UTC.'
  max_turns: 20
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: skill-used
  type: tool_used
  tool: Skill
  min: 1
- name: friday-11th
  type: regex
  pattern: 2026-12-11(?:,? at |[ T]|, )12:00
- name: sunday-13th
  type: regex
  pattern: 2026-12-13(?:,? at |[ T]|, )12:00
- name: friday-18th
  type: regex
  pattern: 2026-12-18(?:,? at |[ T]|, )12:00
- name: mentions-or
  type: regex
  pattern: \b([Ee]ither|OR)\b  # "or" alone is in every sentence; require the rule's wording
- name: no-write
  type: tool_used
  tool: Write
  max: 0
  min: 0

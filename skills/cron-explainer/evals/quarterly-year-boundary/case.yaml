# Draft generated by `sf compile`. Review the prompt and graders before trusting it.
schema_version: '1.1'
name: quarterly-year-boundary
description: Step values in the month field with a run sequence crossing into the next year.
tags:
- draft
execution:
  prompt: When will '0 0 1 */3 *' run next? Now is 2026-11-25(?:,? at |[ T]|, )10:00 UTC.
  max_turns: 20
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: skill-used
  type: tool_used
  tool: Skill
  min: 1
- name: dates-correct  # correctness, any format
  type: regex
  pattern: 2027-01-01[\s\S]*2027-04-01[\s\S]*2027-07-01
- name: three-timestamps  # the house format: three 'YYYY-MM-DD HH:MM' entries
  type: regex
  pattern: \d{4}-\d{2}-\d{2} \d{2}:\d{2}[\s\S]*\d{4}-\d{2}-\d{2} \d{2}:\d{2}[\s\S]*\d{4}-\d{2}-\d{2} \d{2}:\d{2}
- name: no-edit
  type: tool_used
  tool: Edit
  max: 0
  min: 0

# Draft generated by `sf compile`. Review the prompt and graders before trusting it.
schema_version: '1.1'
name: weekday-business-hours-rollover
description: Every-15-minutes weekday schedule where 'now' is after Friday's last run, so the next 
  runs roll over to Monday.
tags:
- draft
execution:
  prompt: When will '*/15 9-17 * * 1-5' run next? Assume now is 2026-03-06(?:,? at |[ T]|, )17:50 UTC. Please explain
    each field too.
  max_turns: 20
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: skill-used
  type: tool_used
  tool: Skill
  min: 1
- name: first-run-monday
  type: regex
  pattern: 2026-03-09(?:,? at |[ T]|, )09:00
- name: third-run
  type: regex
  pattern: 2026-03-09(?:,? at |[ T]|, )09:30
- name: no-bash
  type: tool_used
  tool: Bash
  max: 0
  min: 0
- name: table-and-summary
  type: llm
  criteria: 'The reply has a table with 5 rows (minute, hour, day of month, month, day of week), a one-sentence
    summary, and a numbered list of exactly 3 run times: 2026-03-09(?:,? at |[ T]|, )09:00, 09:15 and 09:30.'

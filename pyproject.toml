[project]
name = "skill-factory"
version = "0.1.0"
description = "Author, evaluate, measure and improve agent skills (Uber-style skill factory)."
readme = "README.md"
authors = [
    { name = "jim", email = "jim@uber.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.13.0",
    "duckdb>=2.0.1",
    "jinja2>=3.1.6",
    "pydantic>=2.14.4",
    "rich>=15.0.0",
    "ruamel-yaml>=0.19.1",
    "typer>=0.29.2",
]

[project.scripts]
sf = "skill_factory.cli:app"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.6",
    "syrupy>=7.0.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs", "skills", "plugins", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "live: calls the real claude CLI / Anthropic API (opt-in: pytest -m live)",
]
